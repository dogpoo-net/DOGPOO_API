spring.application.name=weaver-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.sql.init.mode=never
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath*:net/dogpoo/api/core/**/mapper/*Mapper.xml
jwt.secret=${JWT_SECRET}
jwt.public.url=/dogpoo/weaver/api/auth/**,/resources/**,/dogpoo/api/**,/dopgoo/test/**,/dogpoo/convatar/api/**,/dogpoo/batgers/api/**,/dogpoo/msg/telegram/**,/dogpoo/kakao/chatbot/**,/dogpoo/gesture/forum/thread/post/comment/getForumThreadPostCommentList,/dogpoo/gesture/forum/thread/getForumThreadPostWholeList,/dogpoo/gesture/forum/thread/getGestureForumThreadListSearch,/dogpoo/gesture/forum/thread/updateForumThreadCountingViewNum,/dogpoo/gesture/forum/thread/getForumThreadHeadData,/dogpoo/gesture/forum/thread/getForumThreadPostContent,/dogpoo/gesture/forum/thread/getForumHeadThreadContent,/dogpoo/gesture/forum/user/getGoogleOauthUserInfo,/dogpoo/gesture/forum/user/signUp,/dogpoo/gesture/forum/user/signUpComplete,/dogpoo/gesture/forum/user/initPassSendMail,/dogpoo/gesture/forum/user/initPassCodeAuth,/dogpoo/gesture/forum/user/initPassword,/dogpoo/gesture/forum/user/getCountryCd,/dogpoo/gesture/forum/user/authLogin,/dogpoo/gesture/forum/user/authUuid,/dogpoo/gesture/forum/user/countVisitor,/dogpoo/gesture/forum/user/getVisitorCount,/weaver/api/test/insertWeaverTestData,/weaver/api/test/getWeaverTestData,/dogpoo/weaver/api/test/insertWeaverTestData,/dogpoo/weaver/api/test/getWeaverTestData
server.servlet.context-path=${API_CONTEXT_PATH:}
spring.mvc.servlet.path=/dogpoo
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.task.execution.pool.core-size=10
spring.task.scheduling.pool.size=20
